[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-mcp-server"
version = "0.1.0"
description = "Local MCP server for the local_ai_dss project"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
]

[project.scripts]
local-ai-mcp = "local_ai_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
