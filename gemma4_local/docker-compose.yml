services:
  ollama:
    image: ollama/ollama:latest
    container_name: gemma4-local-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - local-only
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ollama-data:

networks:
  local-only:
    internal: true
